<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Price Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .search-box h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: #374151;
        }

        .title {
            margin: 35px 0 20px;
            font-size: 24px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .brand {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .rating {
            margin-bottom: 18px;
        }

        .view {
            width: 100%;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 12px;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .header h1 {
                font-size: 30px;
            }

            .row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Smart Price Finder</h1>
            <p>Find products closest to your target price</p>
        </div>

        <div class="search-box">
            <h2>Find products around</h2>

            <div class="row">
                <input type="number" id="price" placeholder="Enter target price">
                <button onclick="search()">Search</button>
            </div>
        </div>

        <div class="search-box">
            <h2>Find products in this range</h2>

            <div class="row">
                <input type="number" id="min" placeholder="Minimum price">
                <input type="number" id="max" placeholder="Maximum price">
                <button onclick="range()">Find Products</button>
            </div>
        </div>

        <h2 class="title">Products</h2>

        <div class="products" id="products"></div>

    </div>

    <script>
        let data = [
            {
                name: "Redmi Note 13",
                price: 15999,
                brand: "Xiaomi",
                rating: 4.2
            },
            {
                name: "Samsung Galaxy A55",
                price: 32999,
                brand: "Samsung",
                rating: 4.4
            },
            {
                name: "OnePlus 12",
                price: 64999,
                brand: "OnePlus",
                rating: 4.5
            },
            {
                name: "HP Pavilion 15",
                price: 65999,
                brand: "HP",
                rating: 4.3
            },
            {
                name: "Dell Inspiron 14",
                price: 68999,
                brand: "Dell",
                rating: 4.3
            },
            {
                name: "Google Pixel 9",
                price: 69999,
                brand: "Google",
                rating: 4.5
            },
            {
                name: "Lenovo ThinkPad E14",
                price: 72999,
                brand: "Lenovo",
                rating: 4.4
            },
            {
                name: "iPhone 16",
                price: 79999,
                brand: "Apple",
                rating: 4.7
            },
            {
                name: "MacBook Air",
                price: 99999,
                brand: "Apple",
                rating: 4.8
            }
        ];

        data.sort(function(a, b) {
            return a.price - b.price;
        });

        function find(x) {
            let l = 0;
            let r = data.length - 1;

            while (l <= r) {
                let m = Math.floor((l + r) / 2);

                if (data[m].price === x) {
                    return m;
                }

                if (data[m].price < x) {
                    l = m + 1;
                } else {
                    r = m - 1;
                }
            }

            return l;
        }

        function search() {
            let x = Number(document.getElementById("price").value);

            if (!x) {
                alert("Please enter a price");
                return;
            }

            let i = find(x);
            let result = [];

            if (i > 0) {
                result.push(data[i - 1]);
            }

            if (i < data.length) {
                result.push(data[i]);
            }

            if (i + 1 < data.length) {
                result.push(data[i + 1]);
            }

            result.sort(function(a, b) {
                return Math.abs(a.price - x) - Math.abs(b.price - x);
            });

            show(result);
        }

        function range() {
            let min = Number(document.getElementById("min").value);
            let max = Number(document.getElementById("max").value);

            if (!min || !max || min > max) {
                alert("Please enter a valid price range");
                return;
            }

            let start = find(min);
            let result = [];

            for (let i = start; i < data.length; i++) {
                if (data[i].price > max) {
                    break;
                }

                result.push(data[i]);
            }

            show(result);
        }

        function show(result) {
            let box = document.getElementById("products");

            box.innerHTML = "";

            if (result.length === 0) {
                box.innerHTML = '<div class="empty">No products found.</div>';
                return;
            }

            for (let i = 0; i < result.length; i++) {
                box.innerHTML += `
                    <div class="card">
                        <h3>${result[i].name}</h3>
                        <div class="price">₹${result[i].price.toLocaleString("en-IN")}</div>
                        <div class="brand">Brand: ${result[i].brand}</div>
                        <div class="rating">⭐ ${result[i].rating}</div>
                        <button class="view" onclick="view('${result[i].name}')">
                            View Product
                        </button>
                    </div>
                `;
            }
        }

        function view(name) {
            alert("You selected " + name);
        }

        show(data);
    </script>

</body>
</html>
