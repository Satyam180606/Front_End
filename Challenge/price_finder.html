*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}
.container{width:92%;max-width:1150px;margin:40px auto}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:38px;margin-bottom:10px}
.header p{color:#6b7280}
.box{background:#fff;padding:24px;border-radius:16px;margin-bottom:24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.box h2{font-size:20px;margin-bottom:15px}
.row{display:flex;gap:12px}
input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;outline:none}
input:focus{border-color:#111827}
button{border:0;border-radius:9px;padding:14px 20px;background:#111827;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
button:hover{background:#374151}
.title{margin:32px 0 18px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card h3{font-size:19px;margin-bottom:12px}
.price{font-size:23px;font-weight:700;margin-bottom:8px}
.old{text-decoration:line-through;color:#9ca3af;font-size:14px;margin-left:7px}
.brand{color:#6b7280;margin-bottom:8px}
.rating{margin-bottom:6px}
.stock{color:#16a34a;font-size:14px;margin-bottom:16px}
.view{width:100%}
.empty{background:#fff;padding:25px;border-radius:12px;color:#6b7280}
.info{font-size:14px;color:#6b7280;margin-top:10px}
@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.container{width:94%;margin:25px auto}.header h1{font-size:30px}.row{flex-direction:column}button{width:100%}.products{grid-template-columns:1fr}}
</style>

for(let i=0;i<storeData.categories.length;i++){
    for(let j=0;j<storeData.categories[i].subcategories.length;j++){
        let p=storeData.categories[i].subcategories[j].products;
        for(let k=0;k<p.length;k++) data.push(p[k]);
    }
}

data.sort(function(a,b){return a.price-b.price});

function find(x){
    let l=0,r=data.length;
    while(l<r){
        let m=Math.floor((l+r)/2);
        if(data[m].price<x) l=m+1;
        else r=m;
    }
    return l;
}

function search(){
    let x=Number(document.getElementById("price").value);
    if(!x){
        alert("Please enter a price");
        return;
    }

    let i=find(x);
    let result=[];

    if(i>0) result.push(data[i-1]);
    if(i<data.length) result.push(data[i]);
    if(i+1<data.length) result.push(data[i+1]);

    let seen={};
    result=result.filter(function(a){
        if(seen[a.id]) return false;
        seen[a.id]=true;
        return true;
    });

    result.sort(function(a,b){
        return Math.abs(a.price-x)-Math.abs(b.price-x);
    });

    document.getElementById("title").textContent="Closest Products";
    show(result);
}

function range(){
    let min=Number(document.getElementById("min").value);
    let max=Number(document.getElementById("max").value);

    if(!min || !max || min>max){
        alert("Please enter a valid price range");
        return;
    }

    let start=find(min);
    let end=find(max);
    let result=[];

    for(let i=start;i<data.length && i<end;i++){
        if(data[i].price<=max) result.push(data[i]);
    }

    if(start<data.length && data[start].price===max) result.push(data[start]);

    let seen={};
    result=result.filter(function(a){
        if(seen[a.id]) return false;
        seen[a.id]=true;
        return true;
    });

    document.getElementById("title").textContent="Products in Range";
    show(result);
}

function show(result){
    let box=document.getElementById("products");
    box.innerHTML="";

    if(result.length===0){
        box.innerHTML='<div class="empty">No products found.</div>';
        return;
    }

    for(let i=0;i<result.length;i++){
        let p=result[i];

        box.innerHTML+=`
        <div class="card">
            <h3>${p.name}</h3>
            <div class="price">
                ₹${p.price.toLocaleString("en-IN")}
                <span class="old">₹${p.originalPrice.toLocaleString("en-IN")}</span>
            </div>
            <div class="brand">Brand: ${p.brand}</div>
            <div class="rating">⭐ ${p.rating} (${p.reviews.toLocaleString("en-IN")} reviews)</div>
            <div class="stock">${p.stock} in stock</div>
            <button class="view" onclick="view('${p.id}')">View Product</button>
        </div>`;
    }
}

function view(id){
    let p=data.find(function(a){return a.id===id});
    if(!p) return;

    let s="";
    for(let k in p.specifications){
        s+=k+": "+p.specifications[k]+"\n";
    }

    alert(
        p.name+"\n\n"+
        "Brand: "+p.brand+"\n"+
        "Price: ₹"+p.price.toLocaleString("en-IN")+"\n"+
        "Rating: "+p.rating+"\n"+
        "Reviews: "+p.reviews+"\n"+
        "Stock: "+p.stock+"\n\n"+
        s
    );
}
